<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drummer Lab</title>
    <meta name="description" content="Development lab for the robot drummer: rig, IK and poses at the kit. Not part of the app." />
    <style>
      html, body { margin: 0; height: 100%; background: #050506; color: #d8d4cc; font: 12px/1.45 Inter, Helvetica, Arial, sans-serif; overflow: hidden; }
      #lab { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #panel { position: fixed; top: 12px; left: 12px; width: 236px; max-height: calc(100% - 24px); overflow: auto; background: rgba(12, 12, 14, 0.78); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 10px; backdrop-filter: blur(6px); }
      #panel .h { margin: 8px 0 4px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8fe9f2; }
      #panel button { display: block; width: 100%; margin: 2px 0; padding: 5px 7px; text-align: left; background: rgba(255, 255, 255, 0.05); color: inherit; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 4px; font: inherit; cursor: pointer; }
      #panel button:hover { background: rgba(94, 240, 255, 0.12); }
      #panel button.small { display: inline-block; width: auto; margin-right: 3px; }
      #panel button.accent { border-color: rgba(94, 240, 255, 0.4); }
      #panel .info { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
      #panel .ok { color: #9ad89a; }
      #panel .bad { color: #f0a080; }
      @media (max-width: 600px) { #panel { width: calc(100% - 40px); max-height: 40%; } }
    </style>
  </head>
  <body>
    <canvas id="lab"></canvas>
    <div id="panel"></div>
    <script type="module" src="/src/drums/lab/DrummerLab.ts"></script>
  </body>
</html>
